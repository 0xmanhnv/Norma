name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run; pushes to dev and main
# always run to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned by commit, with the release in a comment: bump both together.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"; echo "$unformatted"; exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      # The suite is offline: no API keys, no network.
      - run: go test ./...

  # The race detector. A failure here blocks a merge like any other test.
  # foldadapter's long-session tests take about nine minutes under -race on a
  # hosted runner, close to go test's default ten-minute limit: hence -timeout.
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 25m ./...

  # Known vulnerabilities reachable from corvid's code, in its dependencies and
  # in the Go standard library of the go.mod toolchain. govulncheck is pinned;
  # bump it like an action.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
